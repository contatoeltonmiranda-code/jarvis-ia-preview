<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="jarvis-canvas"></canvas>

  <div class="title">JARVIS</div>

  <div id="response-container" class="response-floating" aria-live="polite"></div>

  <div class="status-bar">
    <span id="status-text" class="status-text">ESPERA</span>
    <div class="control-row">
      <button id="mic-btn" class="mic-btn" aria-label="Toggle microphone">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <button id="wake-toggle" class="wake-toggle on" aria-label="Toggle wake word" aria-pressed="true" title="Wake word ON">
        <span class="wake-dot"></span>
        <span class="wake-label">AUTO</span>
      </button>
    </div>
  </div>

  <div id="volume-meter" class="volume-meter"></div>

  <div class="provider-picker">
    <label for="provider-toggle" class="provider-picker-label">TTS</label>
    <select id="provider-toggle" class="provider-toggle" aria-label="Select TTS provider">
      <option value="elevenlabs">ElevenLabs (George)</option>
      <option value="webspeech">Web Speech (browser)</option>
    </select>
  </div>

  <div class="voice-picker">
    <label for="voice-select" class="voice-picker-label">VOICE</label>
    <select id="voice-select" class="voice-select" aria-label="Select voice"></select>
  </div>

  <script src="main.js"></script>
</body>
</html>
